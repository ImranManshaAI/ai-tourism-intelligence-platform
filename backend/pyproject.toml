[project]
name = "atip-backend"
version = "0.1.0"
description = "Backend and AI services for the AI Tourism Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
]

[tool.fastapi]
entrypoint = "atip_backend.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atip_backend"]
