[project]
name = "atip-backend"
version = "0.1.0"
description = "Backend and AI services for the AI Tourism Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.19.1",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pypdf>=6.16.1",
    "sentence-transformers>=5.7.0",
    "sqlalchemy>=2.0.52",
]

[tool.fastapi]
entrypoint = "atip_backend.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atip_backend"]
