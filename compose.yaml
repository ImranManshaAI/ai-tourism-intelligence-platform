services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: atip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: atip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - atip_postgres_data:/var/lib/postgresql/data

volumes:
  atip_postgres_data: